# CI stages: lint -> test -> gate.
# See https://github.com/faberline/aw/blob/main/docs/standards/ci.md
# The ruleset requires only the "gate" job. Keep its name fixed.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: "lint: fmt, clippy, deny"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo install --locked cargo-deny --version 0.19.0
      - run: cargo deny check
      - run: cargo install --locked cargo-audit --version 0.23.0
      # cargo-audit refuses to clone into a non-empty directory, and the runner's
      # default ~/.cargo/advisory-db is not empty. Use a fresh database path.
      - run: cargo audit --db "${{ runner.temp }}/advisory-db"

  test-default:
    name: "test: workspace (default features)"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked

  test-all-features:
    name: "test: workspace (all features)"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked --all-features

  test-coverage:
    name: "test: workspace, coverage"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --workspace --locked --json --summary-only --output-path target/coverage.json
      - uses: faberline/aw/.github/actions/coverage@4340a382c73351cffff85edba7079e4c24adf3db # S8
        with:
          summary: target/coverage.json

  test-bench:
    name: "test: benchmarks (regression gate)"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sh tools/bench-compare/selftest.sh
      - run: cargo bench --workspace --locked --bench arraykit --bench frame --bench scikit --features scikit/fft,scikit/stats -- --quick
      - run: sh tools/bench-compare/compare.sh
      - run: sh tools/bench-compare/compare.sh --update
        if: always()
        continue-on-error: true

  test-publish-dry-run:
    name: "test: publish dry run"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # A dry-run publish of a crate that depends on an unpublished sibling cannot pass.
      # Only kit-core has no sibling dependency. The other crates get a package list.
      - run: cargo publish --dry-run --locked -p kit-core
      - run: cargo package --list --locked -p kit-http
      - run: cargo package --list --locked -p arraykit
      - run: cargo package --list --locked -p frame
      - run: cargo package --list --locked -p scikit
      - run: cargo package --list --locked -p plotkit
      - run: cargo package --list --locked -p agent-derive
      - run: cargo package --list --locked -p agent

  test-reference:
    name: "test: reference fixtures"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh tools/reference/selftest.sh
      - run: python3 -m venv .venv-reference
      - run: .venv-reference/bin/pip install -r tools/reference/requirements.txt
      - run: REF_VENV=.venv-reference sh tools/reference/run.sh --check
      - run: sh tools/reference/check_table.sh

  gate:
    name: gate
    if: always()
    needs: [lint, test-default, test-all-features, test-coverage, test-publish-dry-run, test-bench, test-reference]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check every stage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.lint.result == "success"' > /dev/null
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
