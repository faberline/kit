[package]
name = "frame"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "DataFrame and Series (Pandas-like)"
repository.workspace = true
readme = "README.md"

[lib]
crate-type = ["rlib"]
bench = false

[dependencies]
thiserror.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
arraykit = { path = "../arraykit" }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
proptest = "=1.12.0"
criterion = "=0.5.1"

[features]
default = []
io-extra = ["dep:serde_json"]
serde = ["dep:serde"]
parallel = ["dep:rayon"]

[[bench]]
name = "frame"
harness = false

[lints]
workspace = true
