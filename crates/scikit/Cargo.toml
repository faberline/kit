[package]
name = "scikit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Scientific computing (inspired by SciPy)."

[lib]
name = "scikit"
crate-type = ["rlib"]
bench = false

[dependencies]
thiserror.workspace = true
serde = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
arraykit = { path = "../arraykit", optional = true }
frame = { path = "../frame", optional = true }

[dev-dependencies]
tempfile = "3"
criterion = "=0.5.1"

[features]
default = ["stats"]
full = ["stats", "fft", "signal", "interpolate", "optimize", "ts", "spatial", "sparse", "integrate"]
stats = []
fft = []
signal = ["fft"]
interpolate = []
optimize = []
ts = ["arraykit", "frame", "stats"]
spatial = []
sparse = []
integrate = []
serde = ["dep:serde"]
parallel = ["dep:rayon"]

[[bench]]
name = "scikit"
harness = false
required-features = ["fft", "stats"]
