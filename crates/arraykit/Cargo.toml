[package]
name = "arraykit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "N-dimensional arrays (inspired by NumPy)."
repository.workspace = true
readme = "README.md"

[lib]
name = "arraykit"
crate-type = ["rlib"]
bench = false

[dependencies]
thiserror.workspace = true
serde = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
criterion = "=0.5.1"

[features]
default = []
serde = ["dep:serde"]
parallel = ["dep:rayon"]

[[bench]]
name = "arraykit"
harness = false
