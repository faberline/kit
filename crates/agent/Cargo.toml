[package]
name = "agent"
version.workspace = true
edition.workspace = true
description = "High-performance LLM agent framework with Rust core"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "agent"
crate-type = ["rlib"]

[dependencies]
# Core dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
bytes.workspace = true
chrono.workspace = true

# Concurrent data structures
dashmap = "5"
once_cell = "1"

# File operations
walkdir = "2"
glob = "0.3"
regex.workspace = true
tempfile.workspace = true

# HTTP client (`kit-http` core)
kit-http = { path = "../kit-http" }

# URL encoding and parsing
urlencoding = "2"
url.workspace = true

# HTML parsing and escaping
html-escape = "0.2"

# Base64 encoding (for Jira auth)
base64.workspace = true

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Token counting
tiktoken-rs = "0.9"

# TOML parsing (for manifest tool)
toml = "0.8"

# JSON schema validation (for structured output)
jsonschema = "0.45"

# Proc-macro derive (companion crate, P4/#1952)
agent-derive = { path = "../agent-derive" }

[dev-dependencies]
tokio-test.workspace = true
# `start_paused` in the stream tests needs the test-util feature.
tokio = { workspace = true, features = ["test-util"] }
proptest = "=1.12.0"
