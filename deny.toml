# cargo-deny configuration
# Run with: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
version = 2
# Ignore specific advisories. Each entry has a reason and an expiry date.
ignore = [
    # RUSTSEC-2026-0543: chrono 0.4.45 is unmaintained and no safe upgrade exists.
    # chrono is used by agent and kit-http. Not a vulnerability.
    # Expires 2027-02-17: re-check then, and replace chrono (jiff or time) if still unmaintained.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no safe upgrade; expires 2027-02-17" },
]

[licenses]
version = 2
allow = [
    "MIT",
    # MIT-0 (MIT No Attribution, OSI approved): borrow-or-share 0.2.4, via fluent-uri -> referencing.
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "CDDL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"  # Allow path dependencies in workspace
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
